{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            
            <h2 class="mb-2 fw-bold">Bienvenido a Ranking de Juegos</h2>
            <p class="text-muted mb-5">Inicia sesión para guardar tus tops personalizados y compartirlos con la comunidad.</p>

            <div class="row g-4">
                <div class="col-6">
                    <a href="{% url 'do_login' %}" class="access-card">
                        <div class="access-icon">
                            <i class="bi bi-person-check-fill"></i> <span class="icon-placeholder">➜</span>
                        </div>
                        <h5>Iniciar Sesión</h5>
                        <p>Ya tengo una cuenta</p>
                    </a>
                </div>

                <div class="col-6">
                    <a href="{% url 'data_load' %}" class="access-card special">
                        <div class="access-icon">
                            <i class="bi bi-person-plus-fill"></i>
                            <span class="icon-placeholder">+</span>
                        </div>
                        <h5>Registrarse</h5>
                        <p>Crear nueva cuenta</p>
                    </a>
                </div>
            </div>

            <div class="mt-5">
                <a href="{% url 'rankings' %}" class="btn btn-link text-decoration-none text-secondary">
                    Continuar como invitado
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Estilos coherentes con el Ranking */
    .access-card {
        background: #fff;
        border: 2px solid #e9ecef;
        border-radius: 20px;
        padding: 30px 20px;
        display: block;
        text-decoration: none !important;
        color: inherit;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        height: 100%;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .access-card:hover {
        transform: translateY(-10px);
        border-color: #0d6efd;
        box-shadow: 0 10px 20px rgba(13, 110, 253, 0.1);
    }

    .access-card.special {
        background: #f8f9fa;
    }

    .access-card.special:hover {
        border-color: #198754;
        box-shadow: 0 10px 20px rgba(25, 135, 84, 0.1);
    }

    .access-icon {
        font-size: 2.5rem;
        margin-bottom: 15px;
        color: #adb5bd;
        background: rgba(0,0,0,0.03);
        width: 70px;
        height: 70px;
        line-height: 70px;
        border-radius: 50%;
        margin-left: auto;
        margin-right: auto;
        transition: all 0.3s ease;
    }

    .access-card:hover .access-icon {
        background: #0d6efd;
        color: white;
    }

    .access-card.special:hover .access-icon {
        background: #198754;
    }

    .icon-placeholder {
        font-weight: bold;
        display: block;
    }

    .access-card h5 {
        font-weight: 700;
        margin-bottom: 8px;
        color: #333;
    }

    .access-card p {
        font-size: 0.85rem;
        color: #6c757d;
        margin: 0;
    }
</style>
{% endblock %}
