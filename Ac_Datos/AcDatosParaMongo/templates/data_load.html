{% extends 'base.html' %}
{% load static %}

{% block body %}
    <div class="container py-5">
        <h3 class="mb-4 text-center" style="color: #062D76">Cargar Datos de Videojuegos</h3>

        {% if mensaje %}
            <div class="alert alert-success">{{ mensaje }}</div>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form id="csvForm" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="csvFile" class="form-label">Seleccionar archivo CSV (Titulo, Plataforma, Fecha, Descripcion)</label>
                <input class="form-control" type="file" id="csvFile" name="csvFile" accept=".csv" required>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-3">
                <button type="button" id="previewBtn" class="btn btn-warning">Previsualizar</button>
                <button type="submit" class="btn btn-primary" style="background-color: #062D76">Guardar en MongoDB</button>
            </div>
        </form>

        <div id="previewContainer" class="mt-5" style="display:none;">
            <h4>Vista previa (Primeras 5 filas):</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-sm" id="previewTable">
                    <thead class="table-dark"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('previewBtn').addEventListener('click', function () {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Selecciona un archivo.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                // Manejo básico de CSV (ojo con las comas dentro de las comillas)
                const rows = text.split('\n').filter(row => row.trim() !== '');

                const tableHead = document.querySelector('#previewTable thead');
                const tableBody = document.querySelector('#previewTable tbody');
                tableHead.innerHTML = '';
                tableBody.innerHTML = '';

                // Encabezados
                const headers = rows[0].split(',');
                const headerRow = document.createElement('tr');
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h.replace(/"/g, '').trim();
                    headerRow.appendChild(th);
                });
                tableHead.appendChild(headerRow);

                // Filas (solo 5)
                rows.slice(1, 6).forEach(row => {
                    const tr = document.createElement('tr');
                    // Regex para separar por comas ignorando las que están dentro de comillas
                    const cells = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',');
                    
                    cells.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell.replace(/"/g, '').trim();
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsText(file);
        });
    </script>
{% endblock %}
