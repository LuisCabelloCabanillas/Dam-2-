<ion-content>
  <div class="container">

    <ion-button routerLink="/" class="boton"><img src="assets/icon/FotoSchoolEvent.png" alt="SchoolEvents Logo" class="logo"/></ion-button>

    <ion-card class="form-card">
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Nombre y apellidos:</ion-label>
          <ion-input type="text" placeholder="Nombre y apellidos"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Correo electrónico:</ion-label>
          <ion-input type="email" placeholder="Correo electrónico"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña:</ion-label>
          <ion-input type="password" placeholder="Contraseña"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Confirmar contraseña:</ion-label>
          <ion-input type="password" placeholder="Contraseña"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Edad:</ion-label>
          <ion-input type="number" placeholder="Edad"></ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" color="medium" routerLink="/pag1-admin">Crear cuenta</ion-button>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
