<ion-content>
  <div class="container">

    <ion-button routerLink="/lista-eventos" class="boton"><img src="assets/icon/FotoSchoolEvent.png" alt="SchoolEvents Logo" class="logo"/></ion-button>

    <ion-card class="forma-carta">
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Número de tarjeta:</ion-label>
          <ion-input type="text" inputmode="numeric" maxlength="16" placeholder="Número de tarjeta" (ionInput)="soloNumeros($event)"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Fecha de caducidad:</ion-label>
          <ion-input type="month" placeholder="MM/AAAA"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Código de seguridad:</ion-label>
          <ion-input type="text" inputmode="numeric" maxlength="3" placeholder="Cód. de seg." (ionInput)="soloNumeros($event)"></ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" color="medium" routerLink="/pago-aceptado">PAGAR</ion-button>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
